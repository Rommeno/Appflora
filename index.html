<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloraCabinet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0faf2;--sf:#fff;--tx:#141d17;--mu:#56635a;--pr:#236846;--on:#fff;--ct:#b4f0cb;--ch:#e2ece5;--ln:#e4ede7;--tile:#f3f8f4;--warn:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--sf:#18221c;--tx:#e6efe9;--mu:#9bab9f;--pr:#7fd9a4;--on:#0b2a19;--ct:#1f4a33;--ch:#233028;--ln:#26342b;--tile:#1d2922;--warn:#ffb4ab}}
:root[data-theme="dark"]{--bg:#0f1712;--sf:#18221c;--tx:#e6efe9;--mu:#9bab9f;--pr:#7fd9a4;--on:#0b2a19;--ct:#1f4a33;--ch:#233028;--ln:#26342b;--tile:#1d2922;--warn:#ffb4ab}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.d{font-family:'Space Grotesk','DM Sans',system-ui,sans-serif;font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:480px;margin:0 auto;padding:0 20px 110px;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;height:64px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;gap:8px;align-items:center;color:var(--pr);font-size:20px;font-weight:700}
.brand svg{font-size:24px}.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--ch)}
h1{font-size:32px;line-height:1.1;margin:18px 0 6px}
.sub{color:var(--mu)}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--ch);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--mu);margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pr);display:inline-block}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sec h2{font-size:22px;display:flex;gap:8px;align-items:center}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pr)}
.tag{background:var(--ct);color:var(--pr);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.card{background:var(--sf);border-radius:28px;padding:20px;border:1px solid var(--ln);margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.btn{background:var(--pr);color:var(--on);border-radius:999px;padding:14px 20px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.soft{background:var(--ct);color:var(--pr)}.btn.ghost{background:var(--ch);color:var(--pr)}.btn.w{width:100%}
.btn.sm{padding:10px 16px;font-size:14px}
.chip{background:var(--ch);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mu);white-space:nowrap}
.circ{width:48px;height:48px;border-radius:50%;background:var(--ch);display:grid;place-items:center;font-size:22px;color:var(--pr);flex:none}
.circ.ct{background:var(--ct)}
.list .it{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.list .it:last-child{border:0}.list{padding:6px 20px}
.name{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.tile{background:var(--tile);border-radius:18px;padding:12px 6px;text-align:center}
.tile small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mu);text-transform:uppercase}
.tile b{font:500 20px 'Space Grotesk',sans-serif}
.tog{width:52px;height:32px;border-radius:999px;background:var(--ch);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--mu);transition:.2s}
.tog[aria-checked=true]{background:var(--pr)}.tog[aria-checked=true]::after{left:24px;background:var(--on)}
input[type=range]{width:100%;accent-color:var(--pr);margin:10px 0}
.seg{display:flex;background:var(--ch);border-radius:999px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:8px;border-radius:999px;font-size:14px;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--tx);font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--ch);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .3s}
.ctl{padding:16px 0;border-bottom:1px solid var(--ln)}.ctl:last-child{border:0}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips button{padding:10px 20px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);white-space:nowrap;font-weight:500}
.chips button[aria-pressed=true]{background:var(--ct);color:var(--pr);border-color:transparent;font-weight:700}
.hero{border-radius:28px;height:230px;position:relative;overflow:hidden;background:linear-gradient(160deg,#cfe3d6,#9db8a6 55%,#6f8b7b);color:#fff;margin-bottom:6px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero svg.leaf{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:130px;height:150px;stroke:none}
.hero .a,.hero .b,.hero .c{position:absolute;font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.9);color:#1f5c3c}
.hero .a{top:14px;left:14px}.hero .b{top:14px;right:14px;background:var(--ct)}.hero .c{bottom:14px;right:14px}
.hero h3{position:absolute;left:16px;bottom:16px;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.m{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m .card{margin:0;padding:16px}.m small{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--mu);text-transform:uppercase}
.m b{display:block;font:500 30px 'Space Grotesk',sans-serif;margin:6px 0}.m span{font-size:12px;font-weight:700;color:var(--pr);display:block;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:8px 10px;border-radius:999px;min-width:62px}
nav button svg{font-size:22px}nav button[aria-current=page]{background:var(--ct);color:var(--pr);font-weight:700}
.scan{height:260px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(160deg,#dfe6e2,#b5c2bb);display:grid;place-items:center}
.scan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .st{position:absolute;background:rgba(255,255,255,.92);color:#1f5c3c;font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px}
.scan .cr{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.85)}
.cr.1{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}.cr.2{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.cr.3{bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 18px}.cr.4{bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 18px 0}
.box{background:var(--tile);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:12px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dual .box{text-align:center;margin:0}.dual b{font:500 24px 'Space Grotesk',sans-serif;display:block}
.dual .goal{background:var(--ct);color:var(--pr)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:18px;margin-bottom:14px;display:grid;gap:10px}
.sheet input,.sheet select{font:inherit;color:var(--tx);background:var(--tile);border:1px solid var(--ln);border-radius:14px;padding:12px}
.rule .row{align-items:flex-start}.rule p{color:var(--mu);margin:4px 0 8px}.rule .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:18px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const P={home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',box:'M3 4h18v4H3zM5 8v12h14V8M10 12h4',plant:'M4 4h16v16H4zM12 17v-6M12 11c0-3 2-4 4-4 0 3-2 4-4 4zM12 13c0-2-1.500-3-3.500-3 0 2.500 1.500 3 3.500 3z',sl:'M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6',scan:'M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M8 8h3v3H8zM13 13h3v3h-3z',bell:'M6 16V11a6 6 0 1112 0v5l2 2H4zM10 21h4',drop:'M12 3s6 6.500 6 11a6 6 0 01-12 0c0-4.500 6-11 6-11z',ok:'M5 12l5 5 9-10',clock:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2',sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.500 1.500M17.500 17.500L19 19M5 19l1.500-1.500M17.500 6.500L19 5',wind:'M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h7',th:'M10 4a2 2 0 014 0v9a4 4 0 11-4 0zM12 9v6',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 11a3.500 3.500 0 100 7 3.500 3.500 0 000-7z',back:'M19 12H5M11 6l-6 6 6 6',heart:'M12 20s-8-5-8-11a4.500 4.500 0 018-2.500A4.500 4.500 0 0120 9c0 6-8 11-8 11z',gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM19 12l2-1-1.500-3-2 .5-1.500-1.500.5-2-3-1.500L12 5 10 3.500 7 5l.5 2L6 8.500l-2-.5L2.500 11l2 1v1l-2 1L4 17l2-.5L7.500 18l-.5 2 3 1.500L12 20l2 1.500 3-1.500-.5-2 1.500-1.500 2 .5L21 14l-2-1z',plus:'M12 5v14M5 12h14',hist:'M3 12a9 9 0 109-9 9 9 0 00-7 3.500L3 8M3 3v5h5M12 8v4l3 2',leaf:'M5 19C5 10 10 5 20 4c0 10-5 15-14 15zM5 19l8-8',flask:'M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3',up:'M12 19V5M6 11l6-6 6 6',dn:'M12 5v14M6 13l6 6 6-6',lay:'M4 5h16v14H4zM9 5v14M15 5v14',fan:'M12 12m-1 0a1 1 0 102 0 1 1 0 10-2 0M12 11C9 6 11 3 14 4c2 1 1 5-2 7zM13 12c5-3 8-1 7 2-1 2-5 1-7-2zM12 13c3 5 1 8-2 7-2-1-1-5 2-7zM11 12C6 15 3 13 4 10c1-2 5-1 7 2z',bm:'M6 3h12v18l-6-4-6 4zM12 8v4M10 10h4',tag:'M12 3l1.500 5 5 1.500-5 1.500L12 16l-1.500-5-5-1.500 5-1.500z',bad:'M5 19L19 5M7 5l12 12-2 2L5 7z'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const LEAF='<svg class="leaf" viewBox="0 0 100 120"><path d="M50 8C20 20 8 55 30 85c8 10 14 14 20 25 6-11 12-15 20-25C92 55 80 20 50 8z" fill="#3f8a5c"/><path d="M50 8C38 25 30 50 38 80c6 8 10 12 12 30z" fill="#f2efc9" opacity=".85"/><path d="M50 14v96M50 40l-20 14M50 40l20 14M50 62l-22 14M50 62l22 14" stroke="#e9f4d8" stroke-width="2" fill="none"/></svg>';
const D={tab:'home',plant:null,fav:true,lights:true,lightPct:85,hum:true,humTarget:75,fan:'Média',res:80,profile:0,adding:false,hist:false,photo:null,
profiles:['Tropical','Estaquia / Mudas','Noite / Repouso'],
shelves:[{n:'Prateleira 1 - Superior',d:'4 plantas: Monsteras & Filodendros',t:24,h:78,i:'up'},{n:'Prateleira 2 - Central',d:'5 plantas: Alocasias & Begónias',t:23.5,h:81,i:'lay'},{n:'Prateleira 3 - Inferior',d:'3 plantas: Propagações & Musgos',t:22,h:85,i:'dn'}],
rules:[{i:'sun',t:'Ciclo de Iluminação',d:'Ligar às 07:00, desligar às 21:00',tag:'Espectro Vegetativo',m:'14h fotoperíodo',on:true},{i:'drop',t:'Manter Humidade',d:'Ligar nebulizador se < 68%',tag:'Sensor Superior',m:'Atualmente 72%',on:true},{i:'wind',t:'Circulação de Ar',d:'Ventilar 10 min a cada hora',tag:'Ventoinha Dupla',m:'Próximo em 18m',on:true},{i:'th',t:'Alerta de Temperatura',d:'Avisar se > 28°C',tag:'Push & Exaustor',m:'Atualmente 24.2°C',on:true}],
plants:[{id:1,n:'Alocasia Frydek',shelf:'Prateleira Superior',how:'150ml',days:0,note:'Substrato seco à superfície'},{id:2,n:'Monstera Deliciosa',shelf:'Prateleira Central',how:'250ml',days:2},{id:3,n:'Philodendron Melanochrysum',shelf:'Base & Propagação',how:'Borrifar',days:3},{id:4,n:'Monstera Thai Constellation',shelf:'Prateleira Superior',how:'150ml',days:3,soil:58,hum:76,temp:24,detail:1,
h:[{i:'drop',t:'Rega leve (150ml)',d:'Água desmineralizada + pH 6.2',w:'Ontem'},{i:'leaf',t:'Nova folha detetada',d:'Comprovada fenestração precoce',w:'Há 5 dias'},{i:'flask',t:'Fertilização suave',d:'Solução NPK 10-10-10 a 25%',w:'Há 12 dias'}]}],
scan:null,scans:[]};
let S=Object.assign({},D);
try{const s=JSON.parse(localStorage.getItem('fc')||'null');if(s)S=Object.assign({},D,s,{tab:'home',plant:null,adding:false,hist:false,photo:null})}catch(e){}
const save=()=>{try{const{photo,...r}=S;localStorage.setItem('fc',JSON.stringify(r))}catch(e){}};
const $=s=>document.querySelector(s);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const top=(l)=>`<div class="top"><div class="brand">${ic('plant')}${l||'FloraCabinet'}</div><button class="ib" data-a="bell" aria-label="Notificações" style="background:none">${ic('bell')}</button></div>`;
const tog=(a,v,l)=>`<button class="tog" role="switch" aria-checked="${v}" aria-label="${l}" data-a="${a}"></button>`;
const when=d=>d===0?'Hoje':d===1?'Amanhã':`Em ${d} dias`;

function home(){
 const pend=S.plants.filter(p=>p.days===0),next=S.plants.filter(p=>p.days>0).sort((a,b)=>a.days-b.days);
 const p=pend[0];
 return top()+`<h1>Olá, Sofia</h1><p class="sub">${pend.length?'Tudo calmo no armário. '+(pend.length==1?'Uma planta precisa':pend.length+' plantas precisam')+' da tua atenção.':'Tudo calmo no armário. Nenhuma planta precisa de rega hoje.'}</p>
 <div class="pill"><span class="dot"></span>Armário Saudável &nbsp;•&nbsp; 23.5°C &nbsp;•&nbsp; 72% Humidade</div>
 <div class="sec"><h2>${ic('drop')}Foco do Dia: Rega</h2><span class="tag">${pend.length} Pendente${pend.length==1?'':'s'}</span></div>
 ${pend.map(p=>`<div class="card"><div class="row sp" style="align-items:flex-start"><div><div class="lbl">${p.shelf}</div><div class="name" style="font-size:22px;margin:8px 0 4px">${p.n}</div><p class="sub">${p.note||'Rega programada'} • ${p.how} recomendados</p></div><div class="circ ct">${ic('drop')}</div></div>
 <div class="row sp" style="border-top:1px solid var(--ln);margin-top:16px;padding-top:16px"><span class="sub row">${ic('clock')}Hoje, pela manhã</span><button class="btn" data-a="water" data-id="${p.id}">${ic('ok')}Marcar Regada</button></div></div>`).join('')||`<div class="card empty">Tudo regado. Volta amanhã.</div>`}
 <div class="sec"><h2 style="font-size:15px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase">A seguir nos próximos dias</h2><span class="sub" style="font-weight:700;font-size:13px">Em espera</span></div>
 <div class="card list" style="padding:6px 20px">${next.map(p=>`<button class="it" data-a="open" data-id="${p.id}"><span class="circ">${ic('plant')}</span><span class="grow"><div class="name">${p.n}</div><div class="sub" style="font-size:14px">${p.shelf} • ${p.how}</div></span><span class="chip">${when(p.days)}</span></button>`).join('')}</div>`}

function cab(){
 return top()+`<div class="row sp" style="margin-top:10px"><div><h1 style="margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">Armário Principal<span class="tag" style="font-size:12px;font-family:'DM Sans'">Online</span></h1><p class="sub" style="font-size:13px;margin-top:4px">Ecossistema M1 • Estufa de Vidro & Carvalho</p></div><button class="ib" data-a="cal" aria-label="Definições" style="background:var(--sf);border:1px solid var(--ln)">${ic('gear')}</button></div>
 <div class="sec" style="margin-top:22px"><span class="lbl">Prateleiras ativas</span><span class="sub" style="font-size:13px">3 Níveis Sincronizados</span></div>
 ${S.shelves.map(s=>`<div class="card"><div class="row"><span class="circ ct">${ic(s.i)}</span><div class="grow"><div class="name" style="font-size:19px">${s.n}</div><div class="sub" style="font-size:14px">${s.d}</div></div><span class="tag">Ideal</span></div>
 <div class="tiles"><div class="tile"><small>Temp</small><b>${s.t}°C</b></div><div class="tile"><small>Humidade</small><b>${s.h}%</b></div><div class="tile"><small>Luz</small><b style="font-size:16px"><span class="dot"></span> ${S.lights?'Ligada':'Desligada'}</b></div></div></div>`).join('')}
 <div class="sec"><span class="lbl">Controlos básicos</span><button class="lbl" data-a="cal" style="display:flex;gap:6px;align-items:center">${ic('sl')}Calibrar</button></div>
 <div class="card" style="padding:6px 20px">
 <div class="ctl"><div class="row sp"><span class="row">${ic('sun')}<b style="font-weight:500">Luzes de Cultivo</b></span><span class="row"><small class="sub">${S.lightPct}%</small>${tog('lights',S.lights,'Luzes de cultivo')}</span></div><input type="range" min="0" max="100" value="${S.lightPct}" data-r="light" aria-label="Intensidade da luz" ${S.lights?'':'disabled'}></div>
 <div class="ctl row sp"><span class="row">${ic('drop')}<span><b style="font-weight:500">Humidificador</b><div class="sub" style="font-size:13px">Alvo Automático: ${S.humTarget}% RH</div></span></span>${tog('hum',S.hum,'Humidificador')}</div>
 <div class="ctl"><div class="row sp"><span class="row">${ic('fan')}<b style="font-weight:500">Ventilação</b></span><small class="sub">Ciclo Ativo</small></div><div class="seg">${['Baixa','Média','Alta'].map(f=>`<button data-a="fan" data-v="${f}" aria-pressed="${S.fan==f}">${f}</button>`).join('')}</div></div>
 <div class="ctl"><div class="row sp"><span class="row">${ic('drop')}Nível do Reservatório</span><b class="d" style="color:var(--pr);font-size:20px">${S.res}%</b></div><div class="bar" style="margin:12px 0 8px"><i style="width:${S.res}%"></i></div><div class="row sp sub" style="font-size:13px"><span>${(S.res*.035).toFixed(1)}L restantes</span><span>Aprox. ${Math.round(S.res*.1125)} dias</span></div></div></div>
 <button class="btn soft w" data-a="cal">${ic('sl')}Calibrar Sensores & Fluxo de Ar</button>`}

function plants(){
 if(S.plant){const p=S.plants.find(x=>x.id==S.plant);return detail(p)}
 return top()+`<h1>Plantas</h1><p class="sub">${S.plants.length} plantas no armário</p><div class="card list" style="margin-top:18px">${S.plants.map(p=>`<button class="it" data-a="open" data-id="${p.id}"><span class="circ ct">${ic('plant')}</span><span class="grow"><div class="name">${p.n}</div><div class="sub" style="font-size:14px">${p.shelf}</div></span><span class="chip">${when(p.days)}</span></button>`).join('')}</div>`}
function detail(p){
 p.h=p.h||[];const soil=p.soil||60;
 return `<div class="row sp" style="height:72px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5"><button class="ib" data-a="back" aria-label="Voltar" style="background:var(--sf);border:1px solid var(--ln)">${ic('back')}</button><div style="text-align:center"><div class="lbl" style="font-size:11px">Ficha botânica</div><div class="name" style="font-size:19px">${p.n}</div></div><button class="ib" data-a="fav" aria-label="Favorito" aria-pressed="${S.fav}" style="background:var(--sf);border:1px solid var(--ln);color:${S.fav?'var(--pr)':'var(--mu)'}">${ic('heart')}</button></div>
 <div class="hero">${S.photo&&S.photo.for==p.id?`<img src="${S.photo.src}" alt="${p.n}">`:LEAF}<span class="a">● ${p.shelf}</span><span class="b">Live IoT</span><h3 style="font-size:18px;bottom:20px">Estágio Vegetativo Ativo</h3><span class="c">Saudável</span></div>
 <div class="sec"><h2>Métricas Vitais</h2><span class="sub" style="font-size:13px">Atualizado há 4m</span></div>
 <div class="m"><div class="card"><small>Humidade</small><b>${p.hum||76}%</b><div class="bar"><i style="width:${p.hum||76}%"></i></div><span>Ideal: 70–85%</span></div>
 <div class="card"><small>Temperatura</small><b>${p.temp||24}°C</b><div class="bar"><i style="width:60%"></i></div><span>Ideal: 22–26°C</span></div>
 <div class="card"><small>Luz solar</small><b>12h<small style="text-transform:none;font-weight:400">/dia</small></b><div class="bar"><i style="width:50%"></i></div><span>Ciclo Fotoperíodo</span></div>
 <div class="card"><small>Próx. rega</small><b>${p.days===0?'hoje':'em '+p.days+'d'}</b><div class="bar"><i style="width:${Math.max(10,100-p.days*20)}%"></i></div><span>Humidade do solo: ${soil}%</span></div></div>
 <div class="sec"><h2>Histórico Recente</h2><span class="lbl" style="text-transform:none;font-size:14px">Ver todos</span></div>
 <div class="card list">${p.h.map(h=>`<div class="it"><span class="circ">${ic(h.i)}</span><span class="grow"><div class="name" style="font-size:16px">${h.t}</div><div class="sub" style="font-size:14px">${h.d}</div></span><span class="chip">${h.w}</span></div>`).join('')||'<div class="empty">Sem registos ainda.</div>'}</div>
 ${S.adding?`<div class="sheet"><select id="ct"><option value="drop|Rega leve (150ml)|Água desmineralizada">Rega</option><option value="flask|Fertilização suave|NPK 10-10-10 a 25%">Fertilização</option><option value="leaf|Nova folha detetada|Observação manual">Nova folha</option></select><button class="btn" data-a="logsave" data-id="${p.id}">Guardar registo</button></div>`:''}
 <div class="row" style="gap:12px"><button class="btn grow" data-a="log">${ic('ok')}Registar Cuidado</button><button class="btn soft grow" data-a="photo" data-for="${p.id}">${ic('cam')}Adicionar Foto</button></div>`}

function auto(){
 return top()+`<div class="row sp" style="align-items:flex-end;margin-top:10px"><div><div class="lbl" style="color:var(--mu)">Controlo ambiental</div><h1 style="margin:4px 0 0">Automações</h1></div><button class="btn sm" data-a="newrule">${ic('plus')}Nova Regra</button></div>
 <div class="lbl" style="color:var(--mu);margin:22px 0 10px">Perfis rápidos</div><div class="chips">${S.profiles.map((p,i)=>`<button data-a="prof" data-v="${i}" aria-pressed="${S.profile==i}">${p}</button>`).join('')}</div>
 ${S.nr?`<div class="sheet"><input id="nt" placeholder="Nome da regra (ex.: Rega noturna)"><input id="nd" placeholder="Condição (ex.: Ligar bomba se solo < 40%)"><button class="btn" data-a="saverule">Guardar regra</button></div>`:''}
 <div class="sec" style="margin-top:20px"><span class="lbl" style="color:var(--mu)">Regras ativas (${S.rules.filter(r=>r.on).length})</span><span class="row" style="gap:6px;font-size:13px;color:var(--pr);font-weight:700"><span class="dot"></span>Sistema Estável</span></div>
 ${S.rules.map((r,i)=>`<div class="card rule"><div class="row"><span class="circ">${ic(r.i)}</span><div class="grow"><div class="name" style="font-size:19px">${r.t}</div><p>${r.d}</p><div class="meta"><span class="chip" style="font-weight:700">${r.tag}</span><span>• ${r.m}</span></div></div>${tog('rule',r.on,r.t).replace('data-a="rule"',`data-a="rule" data-v="${i}"`)}</div></div>`).join('')}
 <div class="lbl" style="color:var(--mu);margin:24px 0 10px">Ações rápidas manuais</div>
 <div class="row" style="gap:12px"><button class="btn soft grow" data-a="mist">${ic('drop')}Névoa Manual 30s</button><button class="btn grow" style="background:var(--sf);color:var(--tx);border:1px solid var(--ln)" data-a="maxlight">${ic('sun')}Luz Máxima</button></div>`}

function scanner(){
 const r=S.scan;
 return `<div class="top"><div class="brand"><span class="circ" style="width:40px;height:40px;font-size:20px">${ic('plant')}</span>Diagnóstico por Foto</div><button class="ib" data-a="hist" aria-label="Histórico">${ic('hist')}</button></div>
 <div class="scan">${S.photo&&S.photo.for==='scan'?`<img src="${S.photo.src}" alt="Planta analisada">`:LEAF.replace('class="leaf"','style="width:110px;height:140px"')}<span class="st">${r?'● Scanner ativo • Análise IA':'Tira ou carrega uma foto'}</span><span class="cr 1"></span><span class="cr 2"></span><span class="cr 3"></span><span class="cr 4"></span><button class="st" style="top:14px;right:44px" data-a="photo" data-for="scan">↻ ${r?'Recapturar':'Capturar'}</button></div>
 ${S.hist?`<div class="card list" style="margin-top:16px">${S.scans.map(s=>`<div class="it"><span class="circ">${ic('bm')}</span><span class="grow"><div class="name" style="font-size:16px">${s.sp}</div><div class="sub" style="font-size:14px">${s.dx}</div></span><span class="chip">${s.w}</span></div>`).join('')||'<div class="empty">Ainda sem diagnósticos guardados.</div>'}</div>`:''}
 ${r?`<div class="card" style="margin-top:16px"><div class="row sp"><div><small class="sub" style="font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:12px">Espécie identificada</small><div class="name" style="font-size:26px;margin-top:4px">${r.sp}</div></div><span class="tag">● ${r.c}% certeza</span></div><div class="bar" style="margin:14px 0"><i style="width:${r.c}%"></i></div>
 <div class="box row"><span class="circ">${ic('bad')}</span><div><small class="sub" style="font-weight:700">Diagnóstico Clínico</small><div class="name" style="font-size:17px">${r.dx}</div></div></div>
 <div class="lbl" style="margin:16px 0 8px;display:flex;gap:6px;align-items:center">${ic('drop')}Sugestão de manejo</div><div class="box" style="margin:0">${r.tip}</div>
 <div class="dual"><div class="box"><small class="sub" style="font-weight:700">Humidade Atual</small><b>58%</b></div><div class="box goal"><small style="font-weight:700">Meta Recomendada</small><b>${r.goal}%</b></div></div></div>
 <button class="btn w" data-a="apply" style="margin-bottom:10px">${ic('sl')}Aplicar Ajuste no Armário</button><button class="btn ghost w" data-a="saveScan">${ic('bm')}Guardar no Histórico</button>`:`<div class="card empty" style="margin-top:16px">Carrega uma foto da planta para identificar a espécie e receber sugestões de cuidado.</div>`}`}

const V={home,armario:cab,plantas:plants,auto,scanner};
const N=[['home','home','Início'],['armario','box','Armário'],['plantas','plant','Plantas'],['auto','sl','Automações'],['scanner','scan','Scanner']];
function render(){
 $('#app').innerHTML=V[S.tab]();
 $('#nav').innerHTML=N.map(n=>`<button data-a="tab" data-v="${n[0]}" ${S.tab==n[0]?'aria-current="page"':''}>${ic(n[1])}${n[2]}</button>`).join('');
 save();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=+b.dataset.id;
 const pl=i=>S.plants.find(p=>p.id==i);
 if(a==='tab'){S.tab=v;S.plant=null;S.adding=false;scrollTo(0,0)}
 else if(a==='water'){const p=pl(id);p.days=5;(p.h=p.h||[]).unshift({i:'drop',t:'Rega ('+p.how+')',d:'Marcada na app',w:'Agora'});toast(p.n+' regada ✓')}
 else if(a==='open'){S.tab='plantas';S.plant=id;scrollTo(0,0)}
 else if(a==='back')S.plant=null;
 else if(a==='fav'){S.fav=!S.fav}
 else if(a==='lights')S.lights=!S.lights;
 else if(a==='hum'){S.hum=!S.hum;toast('Humidificador '+(S.hum?'ligado':'desligado'))}
 else if(a==='fan')S.fan=v;
 else if(a==='cal')toast('Calibração iniciada…');
 else if(a==='bell')toast('Sem novas notificações');
 else if(a==='rule'){S.rules[+v].on=!S.rules[+v].on}
 else if(a==='prof'){S.profile=+v;toast('Perfil: '+S.profiles[+v])}
 else if(a==='mist')toast('Névoa a correr durante 30s…');
 else if(a==='maxlight'){S.lights=true;S.lightPct=100;toast('Luz a 100%')}
 else if(a==='newrule')S.nr=!S.nr;
 else if(a==='saverule'){const t=$('#nt').value.trim(),d=$('#nd').value.trim();if(!t)return toast('Dá um nome à regra');S.rules.push({i:'sl',t,d:d||'Regra personalizada',tag:'Personalizada',m:'Nova',on:true});S.nr=false}
 else if(a==='log')S.adding=!S.adding;
 else if(a==='logsave'){const[i,t,d]=$('#ct').value.split('|');const p=pl(id);p.h.unshift({i,t,d,w:'Agora'});if(i==='drop')p.days=5;S.adding=false;toast('Cuidado registado')}
 else if(a==='photo'){window._for=b.dataset.for;$('#file').click();return}
 else if(a==='hist')S.hist=!S.hist;
 else if(a==='apply'){S.humTarget=S.scan.goal;S.hum=true;toast('Alvo do armário: '+S.scan.goal+'% RH')}
 else if(a==='saveScan'){S.scans.unshift({sp:S.scan.sp,dx:S.scan.dx,w:'Agora'});toast('Guardado no histórico')}
 render();
});
document.addEventListener('input',e=>{if(e.target.dataset.r==='light'){S.lightPct=+e.target.value;e.target.closest('.ctl').querySelector('small').textContent=S.lightPct+'%';save()}});
$('#file').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{S.photo={src:fr.result,for:window._for==='scan'?'scan':+window._for};
  if(window._for==='scan'){S.scan={sp:'Alocasia Polly',c:98,dx:'Leve ressecamento nas pontas',tip:'Aumentar a humidade na prateleira para 75% nos próximos dias e verificar substrato.',goal:75};toast('Análise concluída (demonstração)')}
  render()};fr.readAsDataURL(f);e.target.value='';
});
render();
</script>
</body>
</html>
